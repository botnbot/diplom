
services:
  nginx:
    image: nginx:alpine
    container_name: diplom_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  db:
    image: postgres:15
    container_name: diplom_db
    environment:
      POSTGRES_DB: skorodb
      POSTGRES_USER: skoro
      POSTGRES_PASSWORD: skoropassword
      POSTGRES_HOST: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U skoro -d skorodb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: diplom_backend
    command: sh -c "python manage.py migrate && python manage.py generate_data && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    environment:
      POSTGRES_DB: skorodb
      POSTGRES_USER: skoro
      POSTGRES_PASSWORD: skoropassword
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "True"
      SECRET_KEY: "django-insecure-docker-test-key"
    ports:
      - "8001:8000"
    volumes:
      - ./templates:/app/templates
      - static_volume:/app/staticfiles
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  static_volume: