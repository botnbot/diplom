version: '3.8'

services:
  db:
    image: postgres:15
    container_name: diplom_db
    environment:
      POSTGRES_DB: skorodb
      POSTGRES_USER: skoro
      POSTGRES_PASSWORD: skoropassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U skoro -d skorodb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: diplom_backend
    command: sh -c "python manage.py migrate && python manage.py generate_data && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    environment:
      POSTGRES_DB: skorodb
      POSTGRES_USER: skoro
      POSTGRES_PASSWORD: skoropassword
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "True"
      SECRET_KEY: "django-insecure-docker-test-key"
    ports:
      - "8001:8000"
    volumes:
      - ./templates:/app/templates
    depends_on:
      - db

volumes:
  postgres_data: