version: '3.8'

services:
  db:
    image: postgres:15
    container_name: diplom_db
    environment:
      POSTGRES_DB: skorodb
      POSTGRES_USER: skoro
      POSTGRES_PASSWORD: skoropassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skoro -d skorodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: diplom_backend
    environment:
      POSTGRES_DB: skorodb
      POSTGRES_USER: skoro
      POSTGRES_PASSWORD: skoropassword
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: diplom_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume: