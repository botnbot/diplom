<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица маршрутов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
{% verbatim %}
<div id="app" class="container mt-4">
    <h1>📊 Таблица маршрутов</h1>

    <div class="row mb-3">
        <div class="col-md-3">
            <input type="text" class="form-control" v-model="filterName" placeholder="Фильтр по названию" @keyup="applyFilter">
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" v-model="filterQuantityMin" placeholder="Кол-во от" @keyup="applyFilter">
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" v-model="filterQuantityMax" placeholder="Кол-во до" @keyup="applyFilter">
        </div>
        <div class="col-md-2">
            <button class="btn btn-secondary" @click="clearFilters">Сбросить</button>
        </div>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Дата</th>
                <th @click="sortBy('name')" style="cursor:pointer">Название ⬍</th>
                <th @click="sortBy('quantity')" style="cursor:pointer">Количество ⬍</th>
                <th @click="sortBy('distance')" style="cursor:pointer">Расстояние ⬍</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="item in items" :key="item.id">
                <td>{{ item.date }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.distance }}</td>
            </tr>
            <tr v-if="items.length === 0">
                <td colspan="4" class="text-center">Нет данных</td>
            </tr>
        </tbody>
    </table>

    <nav>
        <ul class="pagination">
            <li class="page-item" :class="{disabled: currentPage === 1}">
                <a class="page-link" href="#" @click.prevent="changePage(currentPage-1)">Назад</a>
            </li>
            <li class="page-item"><span class="page-link">Страница {{ currentPage }} из {{ totalPages }}</span></li>
            <li class="page-item" :class="{disabled: currentPage === totalPages}">
                <a class="page-link" href="#" @click.prevent="changePage(currentPage+1)">Вперед</a>
            </li>
        </ul>
    </nav>
</div>

<script>
new Vue({
    el: '#app',
    data: {
        items: [],
        currentPage: 1,
        totalPages: 1,
        totalItems: 0,
        sortByField: '',
        sortOrder: 'asc',
        filterName: '',
        filterQuantityMin: '',
        filterQuantityMax: ''
    },
    mounted() {
        this.loadData();
    },
    methods: {
        loadData() {
            let params = new URLSearchParams();
            params.append('page', this.currentPage);

            if (this.sortByField) {
                params.append('ordering', this.sortOrder === 'asc' ? this.sortByField : `-${this.sortByField}`);
            }

            if (this.filterName) {
                params.append('name__icontains', this.filterName);
            }
            if (this.filterQuantityMin) {
                params.append('quantity__gte', this.filterQuantityMin);
            }
            if (this.filterQuantityMax) {
                params.append('quantity__lte', this.filterQuantityMax);
            }

            let url = `/api/items/?${params.toString()}`;
            console.log('URL:', url);

            axios.get(url)
                .then(response => {
                    this.items = response.data.results;
                    this.totalItems = response.data.count;
                    this.totalPages = Math.ceil(this.totalItems / 10);
                    console.log('Загружено:', this.items.length, 'из', this.totalItems);
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                });
        },

        sortBy(field) {
            if (this.sortByField === field) {
                this.sortOrder = this.sortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                this.sortByField = field;
                this.sortOrder = 'asc';
            }
            this.currentPage = 1;
            this.loadData();
        },

        applyFilter() {
            this.currentPage = 1;
            this.loadData();
        },

        clearFilters() {
            this.filterName = '';
            this.filterQuantityMin = '';
            this.filterQuantityMax = '';
            this.currentPage = 1;
            this.loadData();
        },

        changePage(page) {
            if (page < 1 || page > this.totalPages) return;
            this.currentPage = page;
            this.loadData();
        }
    }
});
</script>
{% endverbatim %}
</body>
</html>
